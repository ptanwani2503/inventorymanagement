<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; --user:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2e36; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); background:var(--card); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header button { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:6px 10px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:900px; width:100%; margin:0 auto; }
  .msg { margin:0 0 14px; display:flex; flex-direction:column; }
  .bubble { padding:10px 14px; border-radius:14px; max-width:100%; overflow-x:auto; }
  .user { align-items:flex-end; } .user .bubble { background:var(--user); color:#fff; max-width:80%; }
  .bot .bubble { background:var(--card); border:1px solid var(--border); }
  .tools { font-size:12px; color:var(--muted); margin-top:4px; }
  .chip { display:inline-block; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:1px 8px; margin-right:4px; }
  table { border-collapse:collapse; margin:6px 0; font-size:13.5px; }
  th,td { border:1px solid var(--border); padding:5px 10px; text-align:left; white-space:nowrap; }
  th { background:var(--bg); }
  #suggest { max-width:900px; margin:0 auto; padding:0 20px 8px; display:flex; flex-wrap:wrap; gap:6px; width:100%; }
  #suggest button { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  #suggest button:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:12px 20px 18px; max-width:900px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font:inherit; }
  form button { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 20px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header><h1>📦 Inventory Agent</h1><button id="reset">New chat</button></header>
<div id="log"></div>
<div id="suggest"></div>
<form id="f"><input id="q" placeholder="Ask about stock, prices, or add/update products…" autocomplete="off" autofocus><button id="send">Send</button></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
let sid = 's' + Math.random().toString(36).slice(2);
const samples = [
  "Show all low-stock or out-of-stock products.",
  "List available products in the Electronics category.",
  "What is the price and stock quantity of SKU LAP-001?",
  "Update the stock quantity of SKU LAP-001 to 25.",
  "Add a Wireless Mouse under Electronics with SKU MOU-101, price ₹799, and stock quantity 50."
];
samples.forEach(s => { const b = document.createElement('button'); b.type='button'; b.textContent = s.length>42 ? s.slice(0,40)+'…' : s; b.title=s; b.onclick=()=>ask(s); document.getElementById('suggest').append(b); });

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cells = l => l.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
const isRow = l => /^\s*\|.*\|\s*$/.test(l), isSep = l => /^\s*\|[\s:|-]+\|\s*$/.test(l);
function md(text) {
  const lines = esc(text).split('\n'); let out = [], buf = [], i = 0;
  const flush = () => { if (buf.length) { out.push('<div>' + buf.join('<br>') + '</div>'); buf = []; } };
  while (i < lines.length) {
    if (isRow(lines[i]) && i+1 < lines.length && isSep(lines[i+1])) {
      flush(); const head = cells(lines[i]); i += 2; const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push('<table><thead><tr>' + head.map(h=>`<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c=>`<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
    } else buf.push(lines[i++]);
  }
  flush();
  return out.join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function add(role, html, tools) {
  const m = document.createElement('div'); m.className = 'msg ' + role;
  m.innerHTML = `<div class="bubble">${html}</div>` + (tools && tools.length ? `<div class="tools">🔧 ${tools.map(t=>`<span class="chip">${esc(t.tool)}</span>`).join('')}</div>` : '');
  log.append(m); log.scrollTop = log.scrollHeight; return m;
}
async function ask(text) {
  if (!text.trim()) return;
  add('user', esc(text)); q.value = ''; send.disabled = q.disabled = true;
  const wait = add('bot', '<i>Thinking…</i>');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:text, session_id:sid }) });
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const d = await r.json(); wait.remove(); add('bot', md(d.reply), d.tools_used);
  } catch (e) { wait.remove(); add('bot', '⚠️ ' + esc(e.message)); }
  send.disabled = q.disabled = false; q.focus();
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); ask(q.value); };
document.getElementById('reset').onclick = async () => { await fetch('/api/reset?session_id='+sid, {method:'POST'}); log.innerHTML=''; };
add('bot', 'Hi! Ask me about stock levels, prices, or tell me to update or add products.');
</script>
</body>
</html>
